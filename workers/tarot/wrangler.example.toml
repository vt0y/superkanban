name = "your-project-tarot"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[vars]
FIREBASE_PROJECT_ID = "your-firebase-project-id"
ALLOWED_EMAIL_DOMAINS = "example.com"
ALLOWED_ORIGINS = "https://your-app.example.com"
KKU_API_BASE_URL = "https://your-ai-provider.example.com/v1"
KKU_MODEL_ID = "your-model-id"
DAILY_READING_LIMIT = "5"

[[d1_databases]]
binding = "DB"
database_name = "your-project-tarot"
database_id = "replace-with-d1-database-id"
migrations_dir = "migrations"

[[ratelimits]]
name = "SESSION_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "REVEAL_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 3, period = 60 }

# canva.link expansion for Canva edit documents (results are cached; see src/utils/canva-short-link.ts).
[[ratelimits]]
name = "LINK_RATE_LIMITER"
namespace_id = "1003"
simple = { limit = 10, period = 60 }

[triggers]
crons = ["17 * * * *"]

[observability]
enabled = true
head_sampling_rate = 1
